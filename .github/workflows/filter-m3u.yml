name: Filter M3U Playlists

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch: {}
  push:
    paths:
      - "urls.txt"
      - "epg_urls.txt"
      - "exclude_list.py"
      - "filter_m3u.py"
      - "filter_epg.py"

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install lxml

      - name: Filter M3U playlists
        run: python filter_m3u.py

      - name: Filter and merge EPG
        run: python filter_epg.py

      - name: Commit filtered playlists
        run: |
          mkdir -p playlists
          cp output/*.m3u playlists/ 2>/dev/null || true
          cp output/*.xml playlists/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update filtered playlists $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
